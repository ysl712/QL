<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f4"><title>秦玲的小账本 · 每一笔都清晰</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
:root{--ink:#1d2924;--muted:#8b9690;--line:#e9ece8;--paper:#fff;--bg:#f6f7f4;--green:#24845f;--pale:#eaf4ee;--red:#df7665;--shadow:0 10px 32px #25352c0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:28px 36px 50px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.5px}.brand-mark{width:34px;height:34px;background:var(--green);border-radius:11px;display:grid;place-items:center;color:white;font-size:18px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1.5px;margin-top:2px}.local{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:#59ae7e;border-radius:100%}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:25px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--green);font-size:10px;margin-bottom:7px}.heading h1{font-size:29px;letter-spacing:-1px;margin:0;font-weight:700}.month-select{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;color:var(--ink);font-weight:600;outline:none}.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:15px;margin-bottom:25px}.card{background:var(--paper);border:1px solid #eef0ec;border-radius:16px;box-shadow:var(--shadow)}.balance{background:#236d51;color:white;padding:23px 25px;position:relative;overflow:hidden}.balance:after{content:'';width:170px;height:170px;position:absolute;border:1px solid #ffffff1c;border-radius:50%;right:-38px;top:-83px;box-shadow:0 0 0 20px #ffffff08,0 0 0 42px #ffffff06}.label{font-size:12px;color:var(--muted);font-weight:500}.balance .label{color:#ffffffb8}.amount{font-size:31px;font-weight:700;letter-spacing:-1px;margin-top:8px}.balance .amount{font-size:34px}.subnote{font-size:11px;color:#ffffffab;margin-top:8px}.stat{padding:22px 23px;display:flex;flex-direction:column;justify-content:center}.stat-head{display:flex;align-items:center;gap:8px}.icon{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;font-size:13px}.icon.in{background:#eaf4ee;color:#24845f}.icon.out{background:#fcefeb;color:#d97966}.stat .amount{font-size:24px;margin-top:14px}.stat-foot{font-size:11px;color:var(--muted);margin-top:5px}.content{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:17px;align-items:start}.records{padding:22px 22px 8px}.section-title{font-size:16px;font-weight:700;letter-spacing:-.3px}.section-sub{color:var(--muted);font-size:11px;margin-top:4px}.record-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.search{width:190px;position:relative}.search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fbfcfa;font-size:12px}.search:before{content:'⌕';position:absolute;left:11px;top:5px;color:#89958e;font-size:19px}.filters{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 -22px;padding:0 22px 14px}.filter{border:0;background:transparent;color:var(--muted);font-size:12px;padding:6px 11px;border-radius:7px}.filter.active{background:var(--pale);color:var(--green);font-weight:700}.list{min-height:205px}.day-head{font-size:11px;color:var(--muted);font-weight:600;padding:18px 0 6px}.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f0f2ef;gap:11px}.cat-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#f3f5f1;font-size:17px}.row-main{flex:1;min-width:0}.row-name{font-weight:600;font-size:13px}.row-meta{font-size:10px;color:var(--muted);margin-top:4px}.row-amount{font-weight:700;font-size:13px}.row-amount.income{color:var(--green)}.row-actions{opacity:0;transition:.15s}.row:hover .row-actions{opacity:1}.delete{border:0;background:none;color:#b7bfba;padding:5px}.delete:hover{color:var(--red)}.empty{text-align:center;color:var(--muted);font-size:12px;padding:64px 12px}.side{padding:22px}.form-title{font-size:16px;font-weight:700}.form-desc{font-size:11px;color:var(--muted);margin:5px 0 19px}.toggle{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f2f4f1;border-radius:9px;margin-bottom:17px}.toggle button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:8px;font-size:12px;font-weight:600}.toggle button.active{background:white;box-shadow:0 1px 5px #16271c13;color:var(--green)}.toggle button.active.expense{color:#cf705f}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:600;color:#68736c;margin-bottom:6px}.field input,.field select{width:100%;height:39px;border:1px solid var(--line);background:#fcfdfb;border-radius:8px;padding:0 11px;outline:none;color:var(--ink);font-size:12px}.field input:focus,.field select:focus{border-color:#7eb49a}.money-wrap{position:relative}.money-wrap span{position:absolute;left:12px;top:10px;color:#849087}.money-wrap input{padding-left:27px;font-size:16px;font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.add{width:100%;height:42px;border:0;border-radius:9px;color:white;background:var(--green);font-weight:700;font-size:13px;margin-top:3px;box-shadow:0 4px 9px #24845f30}.add:hover{background:#1c714f}.add.expense{background:#cf705f}.hint{text-align:center;color:#a3aca6;font-size:10px;margin-top:12px}.footer{text-align:center;font-size:10px;color:#a3aca6;margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,15px);opacity:0;background:#23352b;color:#fff;padding:11px 17px;border-radius:9px;font-size:12px;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.shell{padding:22px 20px 36px}.content{grid-template-columns:1fr}.side{grid-row:1}.summary{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}.heading{margin-bottom:18px}.local{font-size:0}.local .dot{width:8px;height:8px}}@media(max-width:500px){.shell{padding:18px 14px}.topbar{margin-bottom:28px}.heading h1{font-size:24px}.month-select{padding:9px 8px;font-size:12px}.summary{gap:9px}.balance,.stat{padding:17px}.balance .amount{font-size:29px}.stat .amount{font-size:19px}.records{padding:18px 15px 7px}.filters{margin:0 -15px;padding:0 15px 12px}.record-top{align-items:flex-start;gap:10px}.search{width:140px}.row-actions{opacity:1}}
</style>
</head>
<body><main class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">✓</div><div>秦玲的小账本<small>POCKET LEDGER</small></div></div><div class="local"><span class="dot"></span>数据仅保存在你的设备</div></header>
<section class="heading"><div><div class="eyebrow">YOUR MONEY, IN FOCUS</div><h1>收支一目了然</h1></div><input class="month-select" id="month" type="month"></section>
<section class="summary"><div class="card balance"><div class="label">本月结余</div><div class="amount" id="balance">¥0.00</div><div class="subnote" id="balanceNote">收入减去支出，掌握每月节奏</div></div><div class="card stat"><div class="stat-head"><span class="icon in">↙</span><span class="label">本月收入</span></div><div class="amount" id="income">¥0.00</div><div class="stat-foot">每一份收入都值得记录</div></div><div class="card stat"><div class="stat-head"><span class="icon out">↗</span><span class="label">本月支出</span></div><div class="amount" id="expense">¥0.00</div><div class="stat-foot">看见消费，心里更有数</div></div></section>
<section class="content"><div class="card records"><div class="record-top"><div><div class="section-title">账单明细</div><div class="section-sub" id="count">记录每一次收支</div></div><div class="search"><input id="search" placeholder="搜索备注或分类…"></div></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="expense">支出</button><button class="filter" data-filter="income">收入</button></div><div class="list" id="list"></div></div>
<aside class="card side"><div class="form-title">记一笔</div><div class="form-desc">把今天的收支好好收起来</div><form id="form"><div class="toggle"><button type="button" class="active" data-type="expense">支出</button><button type="button" data-type="income">收入</button></div><div class="field"><label for="amount">金额</label><div class="money-wrap"><span>¥</span><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div></div><div class="two"><div class="field"><label for="category">分类</label><select id="category"></select></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div></div><div class="field"><label for="note">备注 <span style="font-weight:400;color:#a0aaa3">· 可选</span></label><input id="note" maxlength="40" placeholder="例如：周末咖啡"></div><button class="add" id="add" type="submit">＋ 添加记录</button></form><div class="hint">记录自动保存在当前浏览器</div></aside></section><div class="footer">慢慢记，日子就有了清晰的刻度。</div></main><div class="toast" id="toast"></div>
<script>
const categories={expense:[['餐饮','🍜'],['交通','🚇'],['购物','🛍️'],['居家','🏠'],['娱乐','🎬'],['医疗','💊'],['学习','📚'],['其他','✦']],income:[['工资','💼'],['奖金','🎁'],['理财','📈'],['兼职','🧑‍💻'],['其他','✦']]};let type='expense',filter='all';const $=s=>document.querySelector(s),fmt=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),today=new Date().toISOString().slice(0,10);let items=[];try{items=JSON.parse(localStorage.getItem('pocket-ledger-v1')||'[]')}catch{}$('#month').value=today.slice(0,7);$('#date').value=today;
function cats(){const el=$('#category');el.innerHTML=categories[type].map(([n])=>`<option>${n}</option>`).join('');document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('active',b.dataset.type===type));$('#add').classList.toggle('expense',type==='expense')}
function render(){const month=$('#month').value,monthItems=items.filter(x=>x.date.startsWith(month)),inc=monthItems.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),out=monthItems.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);$('#income').textContent=fmt(inc);$('#expense').textContent=fmt(out);$('#balance').textContent=fmt(inc-out);$('#balanceNote').textContent=monthItems.length?`本月共记录 ${monthItems.length} 笔收支`:'收入减去支出，掌握每月节奏';let shown=monthItems.filter(x=>(filter==='all'||x.type===filter)&&(`${x.note} ${x.category}`).toLowerCase().includes($('#search').value.trim().toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('#count').textContent=`${monthItems.length} 笔记录 · ${$('#month').value.replace('-','年')}月`;if(!shown.length){$('#list').innerHTML='<div class="empty">还没有找到记录<br><span style="display:inline-block;margin-top:7px">记下第一笔，让账本开始生长</span></div>';return}let groups={};shown.forEach(x=>(groups[x.date]??=[]).push(x));$('#list').innerHTML=Object.entries(groups).map(([date,rows])=>`<div class="day-head">${date.replaceAll('-','.')} ${date===today?'· 今天':''}</div>`+rows.map(x=>{const icon=categories[x.type].find(c=>c[0]===x.category)?.[1]||'✦';return `<div class="row"><div class="cat-icon">${icon}</div><div class="row-main"><div class="row-name">${esc(x.note||x.category)}</div><div class="row-meta">${x.category} · ${x.type==='income'?'收入':'支出'}</div></div><div class="row-amount ${x.type}">${x.type==='income'?'+':'−'}${fmt(x.amount)}</div><div class="row-actions"><button class="delete" data-del="${x.id}" title="删除记录">×</button></div></div>`}).join('')).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('pocket-ledger-v1',JSON.stringify(items));render()}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{type=b.dataset.type;cats()});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(a=>a.classList.toggle('active',a===b));render()});$('#month').onchange=render;$('#search').oninput=render;$('#form').onsubmit=e=>{e.preventDefault();const amount=Number($('#amount').value);if(!Number.isFinite(amount)||amount<=0)return;items.push({id:Date.now(),type,amount,category:$('#category').value,date:$('#date').value,note:$('#note').value.trim()});save();$('#amount').value='';$('#note').value='';toast('已记下这一笔')};$('#list').onclick=e=>{const b=e.target.closest('[data-del]');if(b){items=items.filter(x=>x.id!==Number(b.dataset.del));save();toast('记录已删除')}};cats();render();
</script></body></html>
